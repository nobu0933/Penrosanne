<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Penrosanne</title><link rel="stylesheet" href="game.css?v=20260925-log-toggle"></head>
<body>
<main class="game-table">
 <div id="board-frame"><canvas id="board" data-i18n-aria-label="board.canvas" aria-label="ゲーム盤面"></canvas>
  <div id="placement-actions" class="placement-actions hidden">
   <button id="redo-tile" data-i18n-title="ui.undo" data-i18n-aria-label="ui.undo"><img class="ui-icon" src="assets/icons/close.svg" alt="" aria-hidden="true"></button>
   <button id="rotate-tile" data-i18n-title="board.rotate" data-i18n-aria-label="board.rotate"><img class="ui-icon" src="assets/icons/rotate.svg" alt="" aria-hidden="true"></button>
   <button id="rotate-terrain" data-i18n-title="board.rotateTerrain" data-i18n-aria-label="board.rotateTerrain"><img class="ui-icon" src="assets/icons/rotate.svg" alt="" aria-hidden="true"></button>
   <button id="mirror-terrain" data-i18n-title="board.mirrorTerrain" data-i18n-aria-label="board.mirrorTerrain"><img class="ui-icon" src="assets/icons/mirror.svg" alt="" aria-hidden="true"></button>
   <button id="confirm-placement" class="primary" data-i18n-title="board.confirm" data-i18n-aria-label="board.confirm"><img class="ui-icon" src="assets/icons/check.svg" alt="" aria-hidden="true"></button>
   <button id="skip-meeple" data-i18n-title="board.skipMeeple" data-i18n-aria-label="board.skipMeeple"><img class="ui-icon" src="assets/icons/forward.svg" alt="" aria-hidden="true"></button>
  </div>
 </div>
 <header class="table-header">
  <a class="brand" href="index.html">PENROSANNE<img class="brand-mark" src="assets/icons/brand-mark.svg" alt="" aria-hidden="true"></a>
  <div id="scoreboard" class="scoreboard" aria-live="polite"></div>
  <nav class="table-tools">
   <button id="replay-game" class="hidden" data-i18n-title="log.replayButton" data-i18n-aria-label="log.replayButton"><img class="ui-icon" src="assets/icons/replay.svg" alt="" aria-hidden="true"></button>
   <button id="reset-view" data-i18n-title="nav.resetView" data-i18n-aria-label="nav.resetView"><img class="ui-icon" src="assets/icons/reset-view.svg" alt="" aria-hidden="true"></button>
   <button id="open-settings" data-i18n-title="section.settings" data-i18n-aria-label="section.settings"><img class="ui-icon" src="assets/icons/settings.svg" alt="" aria-hidden="true"></button>
   <button id="toggle-log" aria-controls="log-area" aria-expanded="false"><span class="log-toggle-bars" aria-hidden="true"><span></span><span></span><span></span></span></button>
  </nav>
 </header>
 <footer class="turn-status"><div id="title-status" class="title-status hidden"></div><span id="active-player-label"></span><h1 id="turn-heading"></h1><div class="deck-count"><span><img class="deck-icon" src="assets/icons/thin.svg" alt="" aria-hidden="true"><strong id="thin-count">0</strong></span><span><img class="deck-icon" src="assets/icons/fat.svg" alt="" aria-hidden="true"><strong id="fat-count">0</strong></span></div></footer>
 <section id="current-hand" class="current-hand hidden" aria-label="Current tile"><canvas id="current-tile" width="220" height="180" aria-hidden="true"></canvas><div class="hand-actions"><button id="redraw-tile" data-i18n="ui.redraw">引き直す</button></div></section>
 <section id="hand-choice" class="hand-choice hidden" role="dialog" aria-labelledby="hand-choice-title"><div class="hand-choice-heading"><strong id="hand-choice-title" data-i18n="hand.choose"></strong><button id="close-hand-choice" data-i18n-aria-label="ui.close"><img class="ui-icon" src="assets/icons/close.svg" alt=""></button></div><div id="hand-choice-options"></div></section>
 <section id="log-area" class="log-area hidden">
  <h2 id="log-title" data-i18n="log.title"></h2>
  <button id="log-section-toggle" class="log-section-toggle hidden" aria-controls="play-log-section" aria-expanded="false"></button>
  <div id="play-log-section" class="log-section-content"><ol id="play-log"></ol></div>
  <button id="score-section-toggle" class="log-section-toggle hidden" aria-controls="final-score-details" aria-expanded="false"></button>
  <div id="final-score-details" class="hidden"></div>
 </section>
 <div hidden><div id="meeple-options"></div></div>
 <dialog id="confirm-dialog" class="confirm-dialog"><div class="confirm-card"><h2 id="confirm-dialog-title"></h2><p id="confirm-dialog-message"></p><div class="confirm-actions"><button id="confirm-dialog-cancel" data-i18n="ui.cancel">キャンセル</button><button id="confirm-dialog-accept" class="primary" data-i18n="ui.continue">続行</button></div></div></dialog>
 <section id="settings-screen" class="settings-screen" aria-labelledby="settings-title">
  <div class="setup-header"><span class="brand">PENROSANNE<img class="brand-mark" src="assets/icons/brand-mark.svg" alt="" aria-hidden="true"></span><button id="close-settings" class="hidden" data-i18n-aria-label="ui.close"><img class="ui-icon" src="assets/icons/close.svg" alt="" aria-hidden="true"></button></div>
  <div class="setup-content">
   <h1 id="settings-title" data-i18n="ui.newGame">新しいゲーム</h1>
   <div class="setup-grid">
    <label><span data-i18n="setup.playerCount"></span><select id="player-count-select"><option value="2" data-i18n="setup.players2"></option><option value="3" data-i18n="setup.players3"></option><option value="4" data-i18n="setup.players4"></option></select></label>
    <label class="player-color-setting" data-player-index="0"><span data-i18n="setup.player1Color"></span><span class="color-control"><img id="player1-color-swatch" alt="" width="44" height="44"><select id="player1-color" data-i18n-aria-label="setup.player1Color"></select></span></label>
    <label class="player-color-setting" data-player-index="1"><span data-i18n="setup.player2Color"></span><span class="color-control"><img id="player2-color-swatch" alt="" width="44" height="44"><select id="player2-color" data-i18n-aria-label="setup.player2Color"></select></span></label>
    <label class="player-color-setting" data-player-index="2"><span data-i18n="setup.player3Color"></span><span class="color-control"><img id="player3-color-swatch" alt="" width="44" height="44"><select id="player3-color" data-i18n-aria-label="setup.player3Color"></select></span></label>
    <label class="player-color-setting" data-player-index="3"><span data-i18n="setup.player4Color"></span><span class="color-control"><img id="player4-color-swatch" alt="" width="44" height="44"><select id="player4-color" data-i18n-aria-label="setup.player4Color"></select></span></label>
    <label><span data-i18n="deck.select"></span><select id="deck-select"></select></label>
    <label><span data-i18n="setup.handMode"></span><select id="hand-mode-select"><option value="single" data-i18n="setup.singleHand"></option><option value="private-city-planning" data-i18n="setup.privatePlanning"></option></select></label>
    <label><span data-i18n="deck.matchingPattern"></span><select id="matching-pattern-mode-select"><option value="both" data-i18n="deck.both"></option><option value="normal-only" data-i18n="deck.normalOnly"></option></select></label>
    <label><span data-i18n="settings.fieldRule"></span><select id="field-rule-mode-select"><option value="enabled" data-i18n="settings.enabled"></option><option value="disabled" data-i18n="settings.disabled"></option></select></label>
    <label><span data-i18n="settings.matchingRule"></span><select id="matching-rule-mode-select"><option value="standard" data-i18n="settings.standardRules"></option><option value="ignore" data-i18n="settings.ignoreMatchingRules"></option></select></label>
    <div id="title-rule-settings" class="title-rule-settings"></div>
    <label><span data-i18n="deck.terrainPattern"></span><select id="terrain-pattern-mode-select"><option value="both" data-i18n="deck.both"></option><option value="normal-only" data-i18n="deck.normalOnly"></option></select></label>
    <label><span data-i18n="deck.terrainMirror"></span><select id="terrain-mirror-mode-select"><option value="unlimited" selected data-i18n="deck.unlimited"></option><option value="disabled" data-i18n="deck.mirrorDisabled"></option></select></label>
    <label><span data-i18n="settings.theme"></span><select id="theme-select"><option value="meadow" selected data-i18n="settings.meadow"></option><option value="none" data-i18n="settings.noTheme"></option></select></label>
    <label><span data-i18n="language.label"></span><select id="language-select"><option value="ja">日本語</option><option value="en">English</option></select></label>
   </div>
   <button id="start-deck" class="primary start-button" data-i18n="ui.start">ゲーム開始</button>
   <details class="debug-tools"><summary data-i18n="ui.development">開発用</summary><label class="toggle-row"><span data-i18n="settings.progressive"></span><input id="progressive-frontier-toggle" type="checkbox" checked></label><a href="tile-gallery.html" data-i18n="nav.gallery"></a><button id="force-end" data-i18n="board.forceEnd"></button></details>
  </div>
 </section>
</main>
<canvas id="held-tile" aria-hidden="true"></canvas>
<script type="module" src="src/main.js?v=20260925-log-toggle"></script>
</body>
</html>
