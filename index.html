<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Penrosanne</title><link rel="stylesheet" href="game.css?v=20260926-player-count-font"></head>
<body>
<main class="game-table">
 <div id="board-frame"><canvas id="board" data-i18n-aria-label="board.canvas" aria-label="ゲーム盤面"></canvas>
  <div id="placement-actions" class="placement-actions hidden">
   <button id="redo-tile" data-i18n-title="ui.undo" data-i18n-aria-label="ui.undo"><img class="ui-icon" src="assets/icons/close.svg" alt="" aria-hidden="true"></button>
   <button id="cycle-placement-pattern" class="placement-pattern-cycle hidden"></button>
   <button id="confirm-placement" class="primary" data-i18n-title="board.confirm" data-i18n-aria-label="board.confirm"><img class="ui-icon" src="assets/icons/check.svg" alt="" aria-hidden="true"></button>
   <button id="skip-meeple" data-i18n-title="board.skipMeeple" data-i18n-aria-label="board.skipMeeple"><img class="ui-icon" src="assets/icons/forward.svg" alt="" aria-hidden="true"></button>
  </div>
 </div>
 <header class="table-header">
  <a class="brand" href="index.html">PENROSANNE<img class="brand-mark" src="assets/icons/brand-mark.svg" alt="" aria-hidden="true"></a>
  <div id="scoreboard" class="scoreboard" aria-live="polite"></div>
  <nav class="table-tools">
   <button id="replay-game" class="hidden" data-i18n-title="log.replayButton" data-i18n-aria-label="log.replayButton"><img class="ui-icon" src="assets/icons/replay.svg" alt="" aria-hidden="true"></button>
   <button id="reset-view" data-i18n-title="nav.resetView" data-i18n-aria-label="nav.resetView"><img class="ui-icon" src="assets/icons/reset-view.svg" alt="" aria-hidden="true"></button>
   <button id="open-settings" data-i18n-title="section.settings" data-i18n-aria-label="section.settings"><img class="ui-icon" src="assets/icons/settings.svg" alt="" aria-hidden="true"></button>
   <button id="toggle-log" aria-controls="log-area" aria-expanded="false"><span class="log-toggle-bars" aria-hidden="true"><span></span><span></span><span></span></span></button>
  </nav>
 </header>
 <footer class="turn-status"><div id="title-status" class="title-status hidden"></div><span id="active-player-label"></span><h1 id="turn-heading"></h1><div class="deck-count"><span><img class="deck-icon" src="assets/icons/thin.svg" alt="" aria-hidden="true"><strong id="thin-count">0</strong></span><span><img class="deck-icon" src="assets/icons/fat.svg" alt="" aria-hidden="true"><strong id="fat-count">0</strong></span></div></footer>
 <section id="current-hand" class="current-hand hidden" aria-label="Current tile"><canvas id="current-tile" width="220" height="180" aria-hidden="true"></canvas><div class="hand-actions"><button id="redraw-tile" data-i18n="ui.redraw">引き直す</button></div></section>
 <section id="hand-choice" class="hand-choice hidden" role="dialog" aria-labelledby="hand-choice-title"><div class="hand-choice-heading"><strong id="hand-choice-title" data-i18n="hand.choose"></strong><button id="close-hand-choice" data-i18n-aria-label="hand.collapse"><img class="ui-icon" src="assets/icons/close.svg" alt=""></button></div><div id="hand-choice-options"></div></section>
 <button id="open-hand-choice" class="hand-choice-trigger hidden" data-i18n-title="hand.reopen" data-i18n-aria-label="hand.reopen"><img class="ui-icon" src="assets/icons/tile-choice.svg" alt="" aria-hidden="true"></button>
 <section id="log-area" class="log-area hidden">
  <h2 id="log-title" data-i18n="log.title"></h2>
  <button id="log-section-toggle" class="log-section-toggle hidden" aria-controls="play-log-section" aria-expanded="false"></button>
  <div id="play-log-section" class="log-section-content"><ol id="play-log"></ol></div>
  <button id="score-section-toggle" class="log-section-toggle hidden" aria-controls="final-score-details" aria-expanded="false"></button>
  <div id="final-score-details" class="hidden"></div>
 </section>
 <div hidden><div id="meeple-options"></div></div>
 <dialog id="confirm-dialog" class="confirm-dialog"><div class="confirm-card"><h2 id="confirm-dialog-title"></h2><p id="confirm-dialog-message"></p><div class="confirm-actions"><button id="confirm-dialog-cancel" data-i18n="ui.cancel">キャンセル</button><button id="confirm-dialog-accept" class="primary" data-i18n="ui.continue">続行</button></div></div></dialog>
 <section id="settings-screen" class="settings-screen" aria-labelledby="settings-title">
  <div class="setup-header"><span class="brand">PENROSANNE<img class="brand-mark" src="assets/icons/brand-mark.svg" alt="" aria-hidden="true"></span><button id="close-settings" class="hidden" data-i18n-aria-label="ui.close"><img class="ui-icon" src="assets/icons/close.svg" alt="" aria-hidden="true"></button></div>
  <div class="setup-content">
   <h1 id="settings-title" data-i18n="ui.newGame">新しいゲーム</h1>
   <div class="setup-language segmented" id="language-choices" role="radiogroup" aria-label="Language"><label><input type="radio" name="setup-language" value="en"><span>English</span></label><label><input type="radio" name="setup-language" value="ja"><span>日本語</span></label></div>
   <div class="setup-grid">
    <div class="setup-player-count setup-labeled-row"><span data-i18n="setup.playerCount"></span><select id="player-count-select" hidden><option value="2">2</option><option value="3">3</option><option value="4">4</option></select><div class="segmented" id="player-count-choices" role="radiogroup" data-i18n-aria-label="setup.playerCount"><label><input type="radio" name="player-count" value="2" checked><span>2</span></label><label><input type="radio" name="player-count" value="3"><span>3</span></label><label><input type="radio" name="player-count" value="4"><span>4</span></label></div></div>
    <div class="player-color-setting" data-player-index="0"><label><span data-i18n="setup.playerName"></span><input id="player1-name" type="text" value="プレイヤー1" maxlength="6" data-default-name="true" autocomplete="off"></label><div class="meeple-color-setting"><span data-i18n="setup.player1Color"></span><span class="meeple-color-picker"><button id="player1-color" class="meeple-color-trigger" type="button" aria-expanded="false" data-i18n-aria-label="setup.player1Color"><img id="player1-color-swatch" alt=""></button><span id="player1-color-menu" class="meeple-color-menu hidden" role="listbox"></span></span></div></div>
    <div class="player-color-setting" data-player-index="1"><label><span data-i18n="setup.playerName"></span><input id="player2-name" type="text" value="プレイヤー2" maxlength="6" data-default-name="true" autocomplete="off"></label><div class="meeple-color-setting"><span data-i18n="setup.player2Color"></span><span class="meeple-color-picker"><button id="player2-color" class="meeple-color-trigger" type="button" aria-expanded="false" data-i18n-aria-label="setup.player2Color"><img id="player2-color-swatch" alt=""></button><span id="player2-color-menu" class="meeple-color-menu hidden" role="listbox"></span></span></div></div>
    <div class="player-color-setting" data-player-index="2"><label><span data-i18n="setup.playerName"></span><input id="player3-name" type="text" value="プレイヤー3" maxlength="6" data-default-name="true" autocomplete="off"></label><div class="meeple-color-setting"><span data-i18n="setup.player3Color"></span><span class="meeple-color-picker"><button id="player3-color" class="meeple-color-trigger" type="button" aria-expanded="false" data-i18n-aria-label="setup.player3Color"><img id="player3-color-swatch" alt=""></button><span id="player3-color-menu" class="meeple-color-menu hidden" role="listbox"></span></span></div></div>
    <div class="player-color-setting" data-player-index="3"><label><span data-i18n="setup.playerName"></span><input id="player4-name" type="text" value="プレイヤー4" maxlength="6" data-default-name="true" autocomplete="off"></label><div class="meeple-color-setting"><span data-i18n="setup.player4Color"></span><span class="meeple-color-picker"><button id="player4-color" class="meeple-color-trigger" type="button" aria-expanded="false" data-i18n-aria-label="setup.player4Color"><img id="player4-color-swatch" alt=""></button><span id="player4-color-menu" class="meeple-color-menu hidden" role="listbox"></span></span></div></div>
    <div class="setup-labeled-row setup-preset-row"><span data-i18n="setup.basicRule"></span><div class="segmented" id="basic-rule-choices" role="radiogroup" data-i18n-aria-label="setup.basicRule"><label><input type="radio" name="basic-rule" value="basic"><span data-i18n="setup.basic">ベーシック</span></label><label><input type="radio" name="basic-rule" value="standard" checked><span data-i18n="setup.standard">スタンダード</span></label><label><input type="radio" name="basic-rule" value="advanced"><span data-i18n="setup.advanced">アドバンスト</span></label></div></div>
   </div>
   <button id="custom-rules-toggle" class="custom-rules-toggle" type="button" aria-expanded="false" aria-controls="custom-rules-content"><span class="custom-arrow" aria-hidden="true">▶</span><span data-i18n="setup.customRules">カスタムルール</span><span id="custom-rules-changed" class="custom-rules-changed hidden" data-i18n-title="setup.changed" aria-hidden="true">●</span></button>
   <div id="custom-rules-content" class="custom-rules-content" aria-hidden="true" inert><div class="custom-rules-inner">
    <div class="setup-labeled-row"><span data-i18n="deck.select">山札</span><select id="deck-select" hidden></select><div id="deck-choices" class="segmented setup-choice-wide" role="radiogroup" data-i18n-aria-label="deck.select"></div></div>
    <div class="setup-labeled-row"><span data-i18n="setup.handMode">手札</span><select id="hand-mode-select" hidden><option value="single">1</option><option value="private-city-planning">3</option></select><div id="hand-mode-choices" class="segmented setup-choice-wide" role="radiogroup" data-i18n-aria-label="setup.handMode"><label><input type="radio" name="hand-mode" value="single" checked><span data-i18n="setup.singleHandShort">1枚（ランダム）</span></label><label><input type="radio" name="hand-mode" value="private-city-planning"><span data-i18n="setup.privatePlanningShort">3枚（私的な都市計画）</span></label></div></div>
    <div class="setup-labeled-row"><span data-i18n="setup.scoring">得点</span><label class="setup-switch"><span class="setup-rule-icon icon-fieldRule" aria-hidden="true"></span><span data-i18n="settings.fieldRule">草原ルール</span><input id="field-rule-mode-select" type="checkbox" checked><span class="switch-face"></span></label></div>
    <div class="setup-labeled-row"><span data-i18n="setup.titles">称号</span><div id="title-rule-settings" class="title-rule-settings"></div></div>
    <div class="setup-labeled-row"><span data-i18n="setup.placementRules">設置規則</span><div class="placement-rule-settings"><label class="setup-switch"><span class="setup-rule-icon icon-matchingRule" aria-hidden="true"></span><span data-i18n="settings.matchingRule">マッチングルール</span><input id="matching-rule-mode-select" type="checkbox" checked><span class="switch-face"></span></label><label class="setup-switch"><span class="setup-rule-icon icon-matchingPattern" aria-hidden="true"></span><span data-i18n="deck.matchingPattern">マッチングの反転</span><input id="matching-pattern-mode-select" type="checkbox" checked><span class="switch-face"></span></label><label class="setup-switch"><span class="setup-rule-icon icon-terrainPattern" aria-hidden="true"></span><span data-i18n="deck.terrainPattern">地形回転</span><input id="terrain-pattern-mode-select" type="checkbox" checked><span class="switch-face"></span></label><label class="setup-switch"><span class="setup-rule-icon icon-terrainMirror" aria-hidden="true"></span><span data-i18n="deck.terrainMirror">地形反転</span><input id="terrain-mirror-mode-select" type="checkbox" checked><span class="switch-face"></span></label></div></div>
   </div></div>
   <p id="estimated-play-time" class="estimated-play-time"></p>
   <button id="start-deck" class="primary start-button" data-i18n="ui.start">ゲーム開始</button>
   <details class="debug-tools"><summary data-i18n="ui.development">開発用</summary><label><span data-i18n="settings.theme">タイルテーマ</span><select id="theme-select"><option value="meadow" selected data-i18n="settings.meadow"></option><option value="none" data-i18n="settings.noTheme"></option></select></label><label><span data-i18n="cpu.generationSetting">CPU世代</span><select id="cpu-generation-select"></select></label><label class="toggle-row"><span data-i18n="settings.progressive"></span><input id="progressive-frontier-toggle" type="checkbox" checked></label><a href="tile-gallery.html" data-i18n="nav.gallery"></a><a href="cpu-training.html" target="_blank" rel="noopener" data-i18n="nav.cpuTraining"></a><button id="export-manual-log" data-i18n="cpu.exportManualLog"></button><button id="force-end" data-i18n="board.forceEnd"></button></details>
  </div>
 </section>
</main>
<canvas id="held-tile" aria-hidden="true"></canvas>
<script type="module" src="src/main.js?v=20260926-player-count-font"></script>
</body>
</html>
