<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Penrosanne — タイル一覧・デバッグ</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<main class="app-shell">
			<header class="topbar">
				<a class="brand" href="index.html" aria-label="ゲーム画面へ戻る"
					>PENROSANNE <span>tile debug</span></a
				>
				<div class="status"><i></i> タイル定義・アンカー確認</div>
				<a class="topbar-link" href="index.html">ゲームへ戻る</a>
			</header>

			<section class="tile-gallery-page" aria-labelledby="gallery-heading">
				<div class="tile-gallery-toolbar panel">
					<div>
						<p class="eyebrow">DEBUG TILE CATALOG</p>
						<h1 id="gallery-heading">タイル一覧</h1>
						<p class="small-note">各アンカーには、配置時と同じ直立／寝そべりミープルを表示します。アンカーへカーソルを合わせると、ゲーム画面と同じ領域だけを着色します。位置調整モードではミープルをドラッグして、現在のテーマ用アンカーを一時調整できます。</p>
					</div>
					<label class="gallery-theme-label">タイルテーマ
						<select id="gallery-theme-select">
							<option value="none">テーマなし（デバッグ）</option>
							<option value="meadow" selected>草原</option>
							<option value="cyber">サイバー</option>
						</select>
					</label>
					<label class="gallery-theme-label">表示するデッキ
						<select id="gallery-deck-select" aria-label="表示するデッキ"></select>
					</label>
					<div class="gallery-anchor-tools">
						<label class="anchor-edit-toggle"><input id="anchor-edit-toggle" type="checkbox" /> アンカー位置を調整</label>
						<button id="copy-anchor-definitions" type="button">現在テーマの全アンカーをコピー</button>
					</div>
					<div class="gallery-deck-tools">
						<label class="anchor-edit-toggle"><input id="deck-adjust-toggle" type="checkbox" /> デッキを調整</label>
						<button id="copy-deck-definitions" type="button">調整後のデッキ定義をコピー</button>
						<p id="deck-adjust-status" class="small-note"></p>
					</div>
				</div>
				<div id="tile-gallery" class="tile-gallery" aria-live="polite"></div>
			</section>
		</main>
		<script type="module" src="src/tile-gallery.js?v=anchor-editor-1"></script>
	</body>
</html>
